name: Uniware inventory pull

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Pull inventory snapshot into storefront DB
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Add GitHub secret CRON_SECRET (same as Vercel CRON_SECRET)"
            exit 1
          fi
          BASE="${SITE_URL:-https://www.streetplayr.com}"
          curl -fsS -H "Authorization: Bearer ${CRON_SECRET}" "${BASE%/}/api/cron/sync-inventory"
