<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#1a1419" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a080a" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="fabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2228"/>
      <stop offset="30%" stop-color="#1e1820"/>
      <stop offset="60%" stop-color="#221c24"/>
      <stop offset="100%" stop-color="#161218"/>
    </linearGradient>
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3h6M3 0v6" stroke="#ffffff" stroke-width="0.15" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#fabric)"/>
  <rect width="800" height="1000" fill="url(#weave)"/>
  <rect width="800" height="1000" filter="url(#noise)" opacity="0.06"/>
  <rect width="800" height="1000" fill="url(#vignette)"/>
  <line x1="200" y1="0" x2="200" y2="1000" stroke="#ffffff" stroke-opacity="0.02" stroke-width="0.5"/>
  <line x1="400" y1="0" x2="400" y2="1000" stroke="#ffffff" stroke-opacity="0.015" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="1000" stroke="#ffffff" stroke-opacity="0.02" stroke-width="0.5"/>
</svg>
