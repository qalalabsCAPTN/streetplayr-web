<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="5" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="30%" stop-color="#1e1622" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#060408" stop-opacity="0.92"/>
    </radialGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221c28"/>
      <stop offset="50%" stop-color="#181420"/>
      <stop offset="100%" stop-color="#0e0a14"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" filter="url(#noise)" opacity="0.06"/>
  <rect width="600" height="800" fill="url(#vignette)"/>
  <rect x="80" y="100" width="440" height="600" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>
</svg>
